name: Headroom
options:
  bundleIdPrefix: com.alfredo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local ad-hoc signing until an Apple Developer account exists
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Headroom:
    type: application
    platform: macOS
    sources: [Headroom]
    info:
      path: Headroom/App/Info.plist
      properties:
        CFBundleDisplayName: Headroom
        # XcodeGen defaults these to "1.0"/"1"; read them from build settings so releases can set the version
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfredo.headroom
        # Needs to read ~/.codex and Claude Code's Keychain item
        ENABLE_APP_SANDBOX: NO

  HeadroomTests:
    type: bundle.unit-test
    platform: macOS
    # Compile Core and Providers directly: hostless tests
    sources:
      - HeadroomTests
      - Headroom/Core
      - Headroom/Providers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfredo.headroom.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Headroom:
    build:
      targets:
        Headroom: all
        HeadroomTests: [test]
    test:
      targets: [HeadroomTests]
