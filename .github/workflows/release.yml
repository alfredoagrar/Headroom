name: Release

# Triggered by pushing a vX.Y.Z tag. The tag ruleset only lets repo admins create v* tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write  # only this job can create the GitHub release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag points to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Headroom.xcodeproj -scheme Headroom -destination 'platform=macOS' test | xcbeautify
      - name: Build Release
        run: |
          set -o pipefail
          VERSION="${TAG#v}"
          xcodebuild -project Headroom.xcodeproj -scheme Headroom -configuration Release \
            -derivedDataPath build MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build | xcbeautify
          ditto -c -k --keepParent build/Build/Products/Release/Headroom.app "Headroom-$VERSION.zip"
          shasum -a 256 "Headroom-$VERSION.zip" > "Headroom-$VERSION.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" "Headroom-$VERSION.zip" "Headroom-$VERSION.zip.sha256" \
            --title "Headroom $VERSION" --generate-notes --verify-tag
